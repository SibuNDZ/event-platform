[build]
builder = "dockerfile"
dockerfilePath = "packages/api/Dockerfile"

[deploy]
preDeployCommand = "npx prisma db push --schema=./prisma/schema.prisma --skip-generate"
startCommand = "node dist/main.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# Public networking must target the same port the process listens on
# (Railway PORT, typically 8080). Dockerfile EXPOSE is 8080.
